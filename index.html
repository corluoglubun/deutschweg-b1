    recovery() { const raw = this.storage.getItem(KEYS.recovery); ensure(typeof raw === 'string' && bytes(raw) <= MAX_BYTES); return validate(JSON.parse(raw), this.dataset, this.count); }
  }
  const api = { VERSION, MAX_BYTES, KEYS, DAY, MINUTE, clone, dayIds, grade, normalize, answerOK, plan, empty, validate, exportBackup, parseBackup, ProgressStore };
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.DeutschwegCore = Object.freeze(api);
})(globalThis);
</script>
<script>/* Interface and sample activities for the portfolio demo; AI-assisted development. */
(function () {
  'use strict';
  const C = globalThis.DeutschwegCore, D = globalThis.DeutschwegDemoData;
  const main = document.querySelector('main'), notice = document.querySelector('#notice');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  let storage;
  try { storage = localStorage; } catch { storage = { getItem() { throw Error('Storage unavailable'); } }; }
  const store = new C.ProgressStore(storage, D.id, D.words.length);
  let state = store.state, route = 'home', cardDay = 1, cardId = null, flipped = false, timer = null, pending = null, exported = false, importSequence = 0;
  function warning(text) { notice.hidden = !text; notice.textContent = text; }
  let saveFault = Boolean(store.error);
  warning(store.error);
  function save(restore = false) {
    try { const result = store.commit(state, restore); saveFault = !result.recovery; warning(result.recovery ? '' : store.error); return true; }
    catch { saveFault = true; warning('Otomatik kayıt başarısız. Bu sayfayı kapatmadan Yedekler bölümünden yedek indir.'); return false; }
  }
  function title(k, text, sub = '') { return `<span class="eyebrow">${k}</span><h1>${text}</h1>${sub ? `<p class="subtle">${sub}</p>` : ''}`; }
  function button(label, action, arg = '', cls = 'secondary') { return `<button class="${cls}" data-action="${action}" data-arg="${arg}">${label}</button>`; }
  function latest(n) { return state.tests.filter(t => t.type === 'daily' && t.days[0] === n).slice(-1)[0]; }
  function stats() { document.querySelector('#score').textContent = `${state.lessonDone.length * 10 + state.tests.length * 15} XP`; document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.arg === route ? 'page' : 'false')); }
  function navigate(view) { clearTimeout(timer); route = view; stats(); ({ home, words, lessons, library, history, backups })[view]?.(); window.scrollTo(0, 0); }
  function home() {
    const practiced = Object.keys(state.cards).length;
    main.innerHTML = title('DEUTSCHWEG · PORTFOLIO DEMOSU', 'Küçük adımlar, yeni yollar.', 'Türkçe destekli Almanca alıştırmaları. 30 örnek kelime; tam B1 kursu değildir.') + `<section class="hero"><span class="eyebrow">ÖNCE KELİMELER</span><h2>Bugün bir kelime daha.</h2><p>${practiced}/${D.words.length} kart çalışıldı · ${state.tests.length} test tamamlandı</p>${button('Kelime günlerime git →', 'nav', 'words', 'primary')}<div class="hero-art" aria-hidden="true"><i></i><i></i><i></i></div></section><div class="tiles"><section class="card"><span class="eyebrow">DENE</span><h2>Cümle atölyesi</h2><p>Kısa sorular ve Türkçe açıklamalar.</p>${button('Alıştırmaları aç', 'nav', 'lessons')}</section><section class="card garden"><span class="eyebrow">KİTAP BAHÇESİ</span><h2>Bir okuma molası.</h2><p>İki kısa hikâye, yeni düşünceler.</p>${button('Hikâyeleri aç', 'nav', 'library')}</section></div>`;
  }
  function words() { main.innerHTML = title('KELİMELER', 'Kendi hızında öğren.', 'Bir gün seç: kartlarla öğren, sonra testini yaz.') + `<div class="tools">${button('Karma test', 'mix')}${button('Bütün notlarım', 'nav', 'history')}${state.active ? button('Yarım kalan test', 'paper') : ''}</div><div class="day-grid">${[1, 2].map(n => `<section class="card"><span class="day-number">${n}</span><h2>Gün ${n}</h2><p>15 kelime · ${C.dayIds(n, 30).filter(id => state.cards[id]).length} kart çalışıldı</p><p class="badge">${latest(n) ? 'Son not: ' + latest(n).grade : 'Henüz test yok'}</p><div class="tools">${button('Kartlarla öğren', 'study', n, 'primary')}${button('Vokabel testi', 'daily', n)}</div></section>`).join('')}</div><details class="card"><summary>Bütün kelimeler · 30</summary><div class="inventory">${D.words.map(w => `<p><strong lang="de">${esc(w.de)}</strong><span>${esc(w.tr)}</span></p>`).join('')}</div></details>`; }
  function study(n) { clearTimeout(timer); cardDay = n; const ids = C.dayIds(n, D.words.length), now = Date.now(); cardId = ids.filter(id => !state.cards[id] || state.cards[id].due <= now).sort((a, b) => (state.cards[a]?.due || 0) - (state.cards[b]?.due || 0))[0]; flipped = false;
    if (cardId === undefined) { const next = Math.min(...ids.map(id => state.cards[id].due)); main.innerHTML = title('KARTLAR', 'Şimdi kısa bir ara.', `Sonraki tekrar: ${new Date(next).toLocaleString('tr-TR')}`) + `<section class="card"><p>Bu süre boyunca uygulama kapalı olabilir. Tekrar takvimi kaydedilir.</p>${button('Günlere dön', 'nav', 'words')}</section>`; timer = setTimeout(() => study(n), Math.min(30000, Math.max(1000, next - now))); return; }
    const w = D.words[cardId]; main.innerHTML = button('← Günler', 'nav', 'words', 'text') + title(`GÜN ${n} · KARTLAR`, 'Hatırla, sonra kontrol et.') + `<article class="card flash"><span class="eyebrow">ALMANCA → TÜRKÇE</span><h2 lang="de">${esc(w.de)}</h2><div id="card-back">${button('Yanıtı göster', 'flip', '', 'primary')}</div></article>`;
  }
  function flip() { if (cardId === null || flipped) return; flipped = true; const w = D.words[cardId]; document.querySelector('#card-back').innerHTML = `<h3>${esc(w.tr)}</h3><p lang="de">${esc(w.example)}</p>${button('Örneği dinle', 'speak', cardId, 'text')}<div class="ratings">${[['again', 'Tekrar'], ['hard', 'Zor'], ['good', 'İyi'], ['easy', 'Kolay']].map(([key, label]) => { const ms = C.plan(state.cards[cardId], key).due - Date.now(); const delay = ms < C.DAY ? Math.max(1, Math.round(ms / C.MINUTE)) + ' dk' : Math.round(ms / C.DAY) + ' gün'; return button(`${label}<small>${delay}</small>`, 'rate', key); }).join('')}</div><p class="subtle">Hatırlamadıysan Tekrar seç. Basitleştirilmiş aralıklı tekrar; Anki veya FSRS değildir.</p>`; }
  function rate(rating) { if (!flipped) return; state.cards[cardId] = C.plan(state.cards[cardId], rating); save(); study(cardDay); }
  function mix() { main.innerHTML = title('KARMA TEST', 'Hangi günleri seçelim?') + `<form id="mix" class="card"><div class="tools">${[1, 2].map(n => `<label class="choice"><input type="checkbox" name="day" value="${n}"> Gün ${n}</label>`).join('')}</div><p>Seçtiğin günlerden 15 farklı kelime sorulur.</p><p id="mix-error" role="status"></p><button class="primary">Testi başlat</button></form>`; }
  function startTest(days, type) { if (state.active && !confirm('Yarım kalan testi bırakıp yeni bir test başlatmak ister misin?')) return; let ids = days.flatMap(n => C.dayIds(n, 30)); if (type === 'mixed') { for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; } ids = ids.slice(0, 15); } state.active = { days, type, ids, answers: ids.map(() => '') }; save(); paper(); }
  function paper() { const a = state.active; if (!a) { words(); return; } main.innerHTML = button('← Günler · test saklanır', 'nav', 'words', 'text') + title('VOKABEL TESTİ', 'Şimdi sıra sende.', 'Türkçesini oku, Almancasını yaz. Küçük yazım hataları ve kayıtlı eş anlamlılar kabul edilir.') + `<form id="paper" class="card"><div class="paper-row"><b>Türkçe</b><b>Almanca yanıtın</b></div>${a.ids.map((id, i) => `<div class="paper-row"><label for="answer-${i}">${i + 1}. ${esc(D.words[id].tr)}</label><input id="answer-${i}" data-answer="${i}" value="${esc(a.answers[i])}" maxlength="150" autocomplete="off" spellcheck="false" lang="de"></div>`).join('')}<p class="subtle">1 en yüksek nottur, 6 yeniden çalışma işaretidir.</p><button class="primary">Bitir ve notumu gör</button></form>`; }
  function finishTest() { const a = state.active; if (!a) return; if (state.tests.length >= 1000) { warning('Demo sınırı: 1000 test. Verilerini yedekle; mevcut notlar silinmedi.'); return; } const rows = a.ids.map((id, i) => ({ id, given: a.answers[i].trim(), ok: C.answerOK(D.words[id], a.answers[i], D.words) })), correct = rows.filter(r => r.ok).length; state.tests.push({ at: Date.now(), days: a.days, type: a.type, rows, correct, grade: C.grade(correct, rows.length) }); rows.filter(r => !r.ok).forEach(r => { state.cards[r.id] = C.plan(state.cards[r.id], 'again'); }); state.active = null; save(); stats(); result(state.tests.length - 1); }
  function result(i) { const t = state.tests[i]; if (!t) return; const notes = ['', 'Harika bir emek! İleride kısa bir tekrar yapmayı unutma.', 'Çok iyi gidiyorsun. Birkaç küçük tekrar seni güçlendirecek.', 'İlerliyorsun. Karışan kelimeleri bir kez daha çalış.', 'Bir temel oluşturdun. Küçük adımlarla devam edebilirsin.', 'Bu sonuç nereden devam edeceğini gösteriyor. Yeniden dene.', 'Bu bir başlangıç noktası. Birkaç kartla sakin sakin yeniden başla.']; main.innerHTML = title('TEST SONUCU', `Notun: ${t.grade}`, `${t.correct}/${t.rows.length} doğru`) + `<section class="card celebration"><p>${notes[t.grade]}</p></section><section class="card">${t.rows.map(r => `<div class="result-row"><strong>${r.ok ? '✓' : '↻'} ${esc(D.words[r.id].tr)}</strong><p>Senin yanıtın: <span lang="de">${esc(r.given || '—')}</span><br>İdeal yanıt: <b lang="de">${esc(D.words[r.id].de)}</b></p></div>`).join('')}</section>${button('Günlere dön', 'nav', 'words', 'primary')}`; }
  function history() { main.innerHTML = title('NOT DEFTERİ', 'Her deneme bir adım.') + `<section class="card">${state.tests.length ? state.tests.map((t, i) => ({ t, i })).reverse().map(({ t, i }) => `<div class="history-row"><span>${new Date(t.at).toLocaleString('tr-TR')}<small>${t.type === 'daily' ? 'Gün ' + t.days[0] : 'Karma · Gün ' + t.days.join(', ')}</small></span>${button('Not ' + t.grade + ' →', 'result', i)}</div>`).join('') : '<p>İlk testini bitirdiğinde notun burada görünecek.</p>'}</section>`; }
  function lessons() { main.innerHTML = title('CÜMLE ATÖLYESİ', 'Üç küçük alıştırma.', 'Bu bölüm resmî sınav veya kapsamlı B1 hazırlığı değildir.') + D.lessons.map((q, i) => `<section class="card"><h2>${esc(q.title)} ${state.lessonDone.includes(i) ? '✓' : ''}</h2>${q.text ? `<p class="passage" lang="de">${esc(q.text)}</p>` : ''}<p lang="de">${esc(q.prompt)}</p><div class="options">${q.options.map((o, j) => button(esc(o), 'lesson', i + ':' + j)).join('')}</div><div id="feedback-${i}" role="status"></div><label for="draft-${i}">Kendi örnek cümlen (otomatik kaydedilir)</label><textarea id="draft-${i}" data-draft="${i}" maxlength="3000" lang="de">${esc(state.drafts[i] || '')}</textarea></section>`).join(''); }
  function lesson(arg) { const [i, chosen] = arg.split(':').map(Number), q = D.lessons[i]; if (!q) return; const ok = q.answer === chosen; if (ok && !state.lessonDone.includes(i)) state.lessonDone.push(i); save(); stats(); const node = document.querySelector('#feedback-' + i); node.className = ok ? 'feedback correct' : 'feedback'; node.textContent = (ok ? 'Doğru! ' : 'Yeniden düşün. ') + q.why; }
  function library() { main.innerHTML = title('KİTAP BAHÇESİ', 'Bir yaprak, bir düşünce.') + D.stories.map(s => `<details class="card story"><summary>${esc(s.title)}</summary><p lang="de">${esc(s.de)}</p><p class="subtle">${esc(s.tr)}</p></details>`).join(''); }
  function backups() { pending = null; exported = false; importSequence++; main.innerHTML = title('YEDEKLER', 'İlerlemeni koru.') + `<section class="card"><p>İlerleme bu tarayıcıda otomatik saklanır. Yerel HTML dosyalarında kalıcılık garanti edilemez. Dosyayı taşımak veya tarayıcı verilerini silmek kayda erişimi etkileyebilir. Gizli pencere kullanma.</p><p>JSON yedekleri şifreli değildir. Yalnızca bu portfolio demosunun yedekleri kabul edilir; özel uygulamanın yedekleri uyumlu değildir.</p>${button('Mevcut ilerlemeyi indir', 'export', '', 'primary')}<hr><label for="import">JSON yedeği seç · en fazla 1 MiB</label><input id="import" type="file" accept=".json,application/json"><p id="import-status" role="status"></p><div id="import-preview"></div></section><section class="card"><h2>Son kurtarma kopyası</h2><p>Önceki kayıt aynı tarayıcıda tutulur. Bağımsız dosya yedeği değildir.</p>${button('Kurtarma kopyasını incele', 'recover')}</section>`; }
  function preview(candidate) { pending = C.validate(candidate, D.id, D.words.length); exported = false; document.querySelector('#import-preview').innerHTML = `<hr><h3>Yedek kontrol edildi</h3><p>${pending.tests.length} test · ${Object.keys(pending.cards).length} kart. Henüz mevcut ilerleme değiştirilmedi.</p>${button('1. Mevcut ilerlemeyi indir', 'export')}<label class="choice"><input id="confirmed" type="checkbox">İndirilen dosyanın bilgisayarımda oluştuğunu kontrol ettim.</label>${button('2. Kontrol edilen yedeği yükle', 'restore', '', 'primary')}`; }
  function download() { try { const text = C.exportBackup(state, D.id, 30), url = URL.createObjectURL(new Blob([text], { type: 'application/json' })), a = document.createElement('a'); a.href = url; a.download = 'Deutschweg-Portfolio-' + new Date().toISOString().replace(/[:.]/g, '-') + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); exported = true; document.querySelector('#import-status').textContent = 'İndirme isteği gönderildi. Dosyanın oluştuğunu kontrol et.'; } catch { warning('Yedek oluşturulamadı. Sayfayı kapatma.'); } }
  function restore() { if (!pending || !exported || !document.querySelector('#confirmed')?.checked) { document.querySelector('#import-status').textContent = 'Önce mevcut yedeği indir ve dosyanın oluştuğunu onayla.'; return; } const before = state; state = pending; if (save(true)) { pending = null; navigate('home'); } else state = before; }
  function speak(id) { const voice = window.speechSynthesis?.getVoices().find(v => v.localService && v.lang.startsWith('de')); if (!voice) { warning('Yerel Almanca ses bulunamadı. Örnek cümleyi sesli okuyabilirsin.'); return; } try { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(D.words[id].example); u.voice = voice; u.lang = 'de-DE'; u.rate = .85; u.onerror = () => warning('Yerel ses oynatılamadı; örnek metni kullan.'); window.speechSynthesis.speak(u); } catch { warning('Ses oynatılamadı; örnek metni kullan.'); } }
  document.addEventListener('click', e => { const b = e.target.closest('[data-action]'); if (!b) return; const a = b.dataset.arg; ({ nav: () => navigate(a), study: () => study(+a), flip, rate: () => rate(a), daily: () => startTest([+a], 'daily'), mix, paper, result: () => result(+a), lesson: () => lesson(a), export: download, restore, recover: () => { try { preview(store.recovery()); } catch { document.querySelector('#import-status').textContent = 'Geçerli kurtarma kopyası yok.'; } }, speak: () => speak(+a) })[b.dataset.action]?.(); });
  document.addEventListener('input', e => { if (e.target.dataset.answer !== undefined && state.active) { const i = +e.target.dataset.answer; if (Number.isInteger(i) && i >= 0 && i < state.active.answers.length) { state.active.answers[i] = e.target.value.slice(0, 150); save(); } } if (e.target.dataset.draft !== undefined) { state.drafts[e.target.dataset.draft] = e.target.value.slice(0, 3000); save(); } });
  document.addEventListener('submit', e => { if (e.target.id === 'paper') { e.preventDefault(); finishTest(); } if (e.target.id === 'mix') { e.preventDefault(); const days = [...e.target.querySelectorAll('input:checked')].map(x => +x.value); if (!days.length) document.querySelector('#mix-error').textContent = 'En az bir gün seç.'; else startTest(days, 'mixed'); } });
  document.addEventListener('change', async e => { if (e.target.id !== 'import') return; const f = e.target.files?.[0], seq = ++importSequence; if (!f) return; try { if (!Number.isFinite(f.size) || f.size > C.MAX_BYTES) throw Error(); const candidate = C.parseBackup(await f.text(), D.id, 30); if (seq === importSequence && route === 'backups') preview(candidate); } catch { if (seq === importSequence && route === 'backups') { pending = null; document.querySelector('#import-preview').textContent = ''; document.querySelector('#import-status').textContent = 'Geçersiz, uyumsuz veya çok büyük yedek. Mevcut kayıt değiştirilmedi.'; } } });
  window.addEventListener('storage', e => { if (e.key === C.KEYS.main || e.key === null) { store.readOnly = true; saveFault = true; warning('Başka bir pencere kaydı değiştirdi. Açık çalışmanı yedekle ve sayfayı yeniden aç.'); } });
  window.addEventListener('beforeunload', e => { if (saveFault) { e.preventDefault(); e.returnValue = ''; } });
  navigate('home');
})();
</script>
